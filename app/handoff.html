<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音浏览器交接</title><link rel="stylesheet" href="style.css"></head><body class="handoff">
<h1>将作品带入抖音</h1><ol class="steps"><li>在当前 Chrome 安装配套“有序图库抖音联动”扩展，保持 App 在线。</li><li>打开抖音创作者中心并登录，准备好一个对应的图文或视频上传页面；检查账号和已有内容。</li><li>点击下方上传按钮，素材交给抖音网页上传。上传完成后，可填写标题与描述，再手动检查并发布。</li></ol>
<div id="summary"></div><div id="status" role="status">正在检查浏览器扩展…</div>
<div class="actions"><a class="button" href="https://creator.douyin.com/creator-micro/content/upload" target="_blank" rel="noopener noreferrer">打开抖音创作者中心</a><button id="upload" class="primary" disabled>将素材上传到抖音编辑页</button><button id="fill" disabled>填写标题与描述</button></div>
<label for="title">标题</label><input id="title" readonly><label for="description">描述</label><textarea id="description" readonly></textarea>
<p>本页不会自动上传或发布。若页面没有检测到扩展，请在已安装扩展的 Chrome 中打开本页。重复上传可能重复添加图片，请先检查抖音页面。</p><script src="handoff.js"></script></body></html>
